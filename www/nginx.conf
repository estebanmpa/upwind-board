# Serves the built SPA inside the www container.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        # Client-side routes (TanStack Router) fall back to index.html.
        try_files $uri $uri/ /index.html;
    }
}
