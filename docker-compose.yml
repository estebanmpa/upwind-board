name: upwind-board-local

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

services:
  upwind-board-server:
    container_name: upwind-board-backend-container
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - 5001:5001
    networks:
      - upwind-board-private-network
      # Shared with the IAM stack, reachable as iam-backend-container.
      - backend-network
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      upwind-board-db:
        condition: service_healthy
      upwind-board-cache:
        condition: service_started

  upwind-board-www:
    container_name: upwind-board-frontend-container
    build:
      context: ./www
      dockerfile: Dockerfile
    ports:
      - 5000:5000
    networks:
      - upwind-board-private-network
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./www/.env
    volumes:
      - ./www:/app
      - /app/node_modules
    depends_on:
      - upwind-board-server

  upwind-board-db:
    image: postgres:17-alpine
    container_name: upwind-board-db-container
    restart: unless-stopped
    logging: *default-logging
    ports:
      - 5434:5432
    networks:
      - upwind-board-private-network
    environment:
      POSTGRES_USER: localuser
      POSTGRES_PASSWORD: localpassword
      POSTGRES_DB: upwindboarddb
    volumes:
      - upwind-board-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  upwind-board-cache:
    image: redis:8-alpine
    container_name: upwind-board-cache-container
    restart: unless-stopped
    logging: *default-logging
    ports:
      - 6381:6379
    networks:
      - upwind-board-private-network
    # noeviction: sessions must never be dropped silently; when the limit is
    # reached Redis rejects writes instead of evicting keys.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "${REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "noeviction"]
    volumes:
      - upwind-board-redis-volume:/data

volumes:
  upwind-board-db-volume:
  upwind-board-redis-volume:

networks:
  upwind-board-private-network:
    driver: bridge

  # Created by the IAM stack (or `docker network create backend-network`).
  backend-network:
    external: true
