name: upwind-board-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

services:

  upwind-board-server:
    container_name: upwind-board-backend-container
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./backend/.env
    depends_on:
      upwind-board-db:
        condition: service_healthy
    networks:
      - proxy-network
      - upwind-board-private-network
    expose:
      - "5001"

  upwind-board-www:
    container_name: upwind-board-frontend-container
    build:
      context: ./www
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./www/.env
    networks:
      - proxy-network

  upwind-board-db:
    image: postgres:17-alpine
    container_name: upwind-board-db-container
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - upwind-board-db-volume:/var/lib/postgresql/data
    networks:
      - upwind-board-private-network
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  upwind-board-db-volume:

networks:
  proxy-network:
    external: true

  upwind-board-private-network:
    driver: bridge
