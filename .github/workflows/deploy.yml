name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  changes:
    name: Detect changed projects
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      www: ${{ steps.filter.outputs.www }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect path changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            www:
              - 'www/**'
            infra:
              - 'docker-compose.prod.yml'

  deploy:
    name: Deploy changed services
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.www == 'true' ||
      needs.changes.outputs.infra == 'true'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/deploy/apps/upwind-board

            echo "Pulling latest changes..."
            git checkout main
            git pull --rebase

            if [ "${{ needs.changes.outputs.backend }}" = "true" ] || [ "${{ needs.changes.outputs.infra }}" = "true" ]; then
              echo "Rebuilding backend (pending migrations run on start)..."
              docker compose -f docker-compose.prod.yml up -d --build upwind-board-server
            fi

            if [ "${{ needs.changes.outputs.www }}" = "true" ] || [ "${{ needs.changes.outputs.infra }}" = "true" ]; then
              echo "Rebuilding frontend..."
              docker compose -f docker-compose.prod.yml up -d --build upwind-board-www
            fi

            echo "Reload Nginx..."
            docker exec reverse-proxy nginx -s reload

            echo "Cleaning unused images..."
            docker image prune -f

            echo "Deploy finished!"
