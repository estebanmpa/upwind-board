services:
  postgres:
    image: postgres:17-alpine
    container_name: upwind-board-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-upwind}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-upwind}
      POSTGRES_DB: ${DB_NAME:-upwind_board}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
